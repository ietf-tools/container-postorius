apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postorius.fullname" . }}
  labels:
    {{- include "postorius.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "postorius.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "postorius.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostname: {{ include "postorius.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postorius.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postorius.secretKey.existingSecretName . }}
                  key: {{ tpl .Values.postorius.secretKey.existingSecretKey . }}
            - name: MAILMAN_REST_URL
              value: {{ .Values.postorius.mailman.url }}
            - name: MAILMAN_REST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postorius.mailman.apiUser.existingSecretName . }}
                  key: {{ tpl .Values.postorius.mailman.apiUser.existingSecretKey . }}
            - name: MAILMAN_REST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postorius.mailman.apiPass.existingSecretName . }}
                  key: {{ tpl .Values.postorius.mailman.apiPass.existingSecretKey . }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postorius.dbUri.existingSecretName . }}
                  key: {{ tpl .Values.postorius.dbUri.existingSecretKey . }}
            - name: MAILMAN_HOSTNAME
              value: {{ .Values.postorius.mailman.hostname }}
            - name: MAILMAN_ARCHIVER_FROM
              value: {{ .Values.postorius.mailman.archiverFrom }}
            - name: MAILMAN_REST_DEBUG
              value: "{{ .Values.postorius.mailman.apiDebug }}"
            - name: ALLOWED_HOSTS
              value: {{ .Values.postorius.allowedHosts }}
            {{- if not .Values.postorius.disableSignups }}
            - name: DISABLE_ALL_SIGNUPS
              value: "{{ .Values.postorius.disableSignups }}"
            {{- end }}
            {{- if not .Values.postorius.disableSocialSignups }}
            - name: DISABLE_SOCIAL_SIGNUPS
              value: "{{ .Values.postorius.disableSocialSignups }}"
            {{- end }}
            - name: SERVE_FROM_DOMAIN
              value: {{ .Values.postorius.hostname }}
            - name: SITE_ID
              value: "{{ .Values.postorius.siteId }}"
            - name: FILTER_VHOST
              value: "{{ .Values.postorius.filterVhost }}"
            {{- if .Values.postorius.smtpHost }}
            - name: SMTP_HOST
              value: {{ .Values.postorius.smtpHost }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ include "postorius.fullname" . }}
              mountPath: /opt/mailman-web-data
      volumes:
        - name: {{ include "postorius.fullname" . }}
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "postorius.fullname" .) .Values.persistence.existingClaim }}
        {{- else }}
          emptyDir: {}
        {{- end }}

      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
